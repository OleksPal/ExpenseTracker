<form>
    <div class="form-group mb-3">
        <i class="bi bi-cart mx-1"></i>
        <label class="control-label">{{ 'CHECKS.MODAL.LOCATION_LABEL' | translate }}</label>
        <input [value]="location" name="location" class="form-control" disabled readonly />
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-wallet2 mx-1"></i>
        <label class="control-label">{{ 'CHECKS.MODAL.PAYER_LABEL' | translate }}</label>
        <input [value]="payer" name="payer" class="form-control" disabled readonly />
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-cash-stack mx-1"></i>
        <label class="control-label">{{ 'CHECKS.MODAL.SUM_LABEL' | translate }}</label>
        <input [value]="totalSum | currency:('GENERAL.CURRENCY_CODE' | translate):('GENERAL.CURRENCY_SYMBOL' | translate)" class="form-control" disabled readonly />
    </div>
    <button type="button" class="btn btn-danger" (click)="submit()">
        <i class="bi bi-trash me-1"></i>{{ 'CHECKS.MODAL.DELETE_BUTTON' | translate }}
    </button>
</form>

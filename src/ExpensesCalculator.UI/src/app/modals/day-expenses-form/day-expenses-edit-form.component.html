<form>
    <div class="form-group mb-3">
        <i class="bi bi-calendar-event-fill mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.DATE_LABEL' | translate }}<span class="text-danger">*</span></label>
        <input [value]="date | date:'EEE, MMM dd, yyyy':'':currentLocale | titlecase" name="date" type="text" class="form-control" [class.is-invalid]="formErrors['date']" [class.is-valid]="formValidated && !formErrors['date'] && date" id="modalDateInput" required readonly/>
        <div class="invalid-feedback d-block" *ngIf="formErrors['date']">{{ formErrors['date'] }}</div>
    </div>
    <div class="form-group mb-3">
        <div class="d-flex justify-content-between align-items-center">
            <label class="control-label mb-0">
                <i class="bi bi-geo-alt-fill me-1"></i>{{ 'EXPENSES.MODAL.LOCATION_LABEL' | translate }}
            </label>
            <small class="text-white" style="font-size: 0.75rem;">{{ location.length }}/25</small>
        </div>
        <input [(ngModel)]="location" name="location" class="form-control" [class.is-invalid]="formErrors['location']" [class.is-valid]="formValidated && !formErrors['location']" maxlength="25" id="location" />
        <div class="invalid-feedback" *ngIf="formErrors['location']">{{ formErrors['location'] }}</div>
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-people-fill mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.PARTICIPANTS_LABEL' | translate }}<span class="text-danger">*</span></label>
        <input [(ngModel)]="participants" name="participants" class="form-control" [class.is-invalid]="formErrors['participants']" id="participants" [placeholder]="'EXPENSES.MODAL.PARTICIPANTS_PLACEHOLDER' | translate" required />
        <label class="form-text text-white small mt-0 pt-0"><span class="text-danger">*</span>
            {{ 'EXPENSES.MODAL.PARTICIPANTS_HINT' | translate }}</label>
        <div class="invalid-feedback" *ngIf="formErrors['participants']">{{ formErrors['participants'] }}</div>
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-cash-stack mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.TOTAL_SUM_LABEL' | translate }}</label>
        <input [value]="totalSum | currency:'UAH':'₴'" class="form-control" disabled readonly />
    </div>
    <button type="button" value="Edit" class="btn btn-warning" (click)="submit()">
        <i class="bi bi-pencil me-1"></i>{{ 'EXPENSES.MODAL.EDIT_BUTTON' | translate }}
    </button>
</form>

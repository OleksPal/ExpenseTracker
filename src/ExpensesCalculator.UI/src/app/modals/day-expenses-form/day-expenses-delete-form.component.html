<form>
    <div class="form-group mb-3">
        <i class="bi bi-calendar-event-fill mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.DATE_LABEL' | translate }}</label>
        <input [value]="date | date:'EEE, MMM dd, yyyy':'':currentLocale | titlecase" name="date" type="text" class="form-control" id="modalDateInput" disabled readonly />
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-geo-alt-fill mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.LOCATION_LABEL' | translate }}</label>
        <input [value]="location" name="location" class="form-control" id="location" disabled readonly />
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-people-fill mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.PARTICIPANTS_LABEL' | translate }}</label>
        <input [value]="participants" name="participants" class="form-control" id="participants" disabled readonly />
    </div>
    <div class="form-group mb-3">
        <i class="bi bi-cash-stack mx-1"></i>
        <label class="control-label">{{ 'EXPENSES.MODAL.TOTAL_SUM_LABEL' | translate }}</label>
        <input [value]="totalSum | currency:'UAH':'₴'" class="form-control" disabled readonly />
    </div>
    <button type="button" value="Delete" class="btn btn-danger" (click)="submit()">
        <i class="bi bi-trash me-1"></i>{{ 'EXPENSES.MODAL.DELETE_BUTTON' | translate }}
    </button>
</form>

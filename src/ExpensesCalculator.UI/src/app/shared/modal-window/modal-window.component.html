<div class="modal fade" [id]="modalId" data-bs-backdrop="static" data-bs-keyboard="false"
    tabindex="-1" [attr.aria-labelledby]="modalId + 'Label'" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"
         [ngClass]="{'modal-sm': modalSize === 'sm', 'modal-lg': modalSize === 'lg', 'modal-xl': modalSize === 'xl'}">
        <div class="modal-content" id="modal-content">
            <!-- Header and content for global modal (service-based) -->
            <ng-container *ngIf="modalId === 'globalModal'">
                <div class="modal-header py-2 bg-dark text-white border-secondary">
                    <h5 class="modal-title" [id]="modalId + 'Label'">{{ modalTitle }}</h5>
                    <button type="button" class="btn-close btn-close-white" (click)="hideModal()" aria-label="Close"></button>
                </div>
                <div class="modal-body bg-dark text-white" style="overflow: visible;">
                    <!-- Dynamic content will be loaded here -->
                    <ng-container #dynamicContent></ng-container>
                </div>
            </ng-container>

            <!-- Content projection for old modals (backwards compatibility) -->
            <ng-container *ngIf="modalId !== 'globalModal'">
                <ng-content></ng-content>
            </ng-container>
        </div>
    </div>
</div>
